name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    name: 测试与构建验证
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -e ".[dev]" pyinstaller

      - name: 运行测试
        run: pytest

      - name: 构建单文件 exe
        run: python scripts/build.py

      - name: 启动烟测
        run: ./scripts/smoke_test.ps1
        shell: pwsh
